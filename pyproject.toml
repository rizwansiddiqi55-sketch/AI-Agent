[project]
name = "rizwan-voice-tutor"
version = "0.1.0"
description = "Bilingual (English/Urdu) AI voice tutor for AI, Python, Networking and English practice"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
